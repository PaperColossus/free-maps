<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Sketcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen tool. Control rail on the left, the map sheet fills the rest; stacks map-first on phones. */
:root {
  --bg: #e4e2dc;
  --rail: #f4f3ef;
  --fg: #1d2126;
  --muted: #646a72;
  --line: #d2cfc7;
  --accent: #2b4c7e;
  --accent-fg: #ffffff;
  --sheet: #d9d6ce;
  --font-display: "Alegreya SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "Alegreya", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518; --rail: #1b1e22; --fg: #e6e3dc; --muted: #9aa0a8; --line: #2c3036;
    --accent: #8fb0e6; --accent-fg: #0f1520; --sheet: #0e1013; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131518; --rail: #1b1e22; --fg: #e6e3dc; --muted: #9aa0a8; --line: #2c3036;
  --accent: #8fb0e6; --accent-fg: #0f1520; --sheet: #0e1013; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--font-body);
}
.app {
  height: 100%; display: grid; grid-template-columns: 320px minmax(0, 1fr);
}
.rail {
  background: var(--rail); border-right: 1px solid var(--line);
  overflow-y: auto; padding-block: 18px 28px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand h1 {
  font: 700 1.6rem/1.1 var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance;
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
legend {
  font: 700 .72rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted); padding: 0 0 10px; width: 100%; border-bottom: 1px solid var(--line); margin-bottom: 4px;
}
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px; }
.row > label, .row > .lbl { font-size: .9rem; }
.row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; min-width: 3ch; text-align: right; }
.slide { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.pair { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto; gap: 6px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
select, input[type="text"] {
  width: 100%; box-sizing: border-box; font: inherit; font-size: .9rem; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
}
.seed { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; }
button {
  font: 600 .9rem var(--font-body); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: .9rem; }
.checks label { display: flex; gap: 6px; align-items: center; }
.checks input { accent-color: var(--accent); }
.hint { color: var(--muted); font-size: .8rem; margin: 0; }
.stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--sheet); }
.stagebar {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between;
  padding-block: 12px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--rail);
}
.stagebar h2 { margin: 0; font: 700 1.15rem/1.2 var(--font-display); text-wrap: balance; }
.stagebar .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.mapwrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 18px; overflow: hidden; }
#map { display: block; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 28px rgba(0,0,0,.12); }
.overlay {
  position: fixed; inset: 0; background: rgba(10,12,15,.72); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.overlay .card {
  background: var(--rail); color: var(--fg); border-radius: 10px; padding: 16px; max-width: min(900px, 100%);
  max-height: 100%; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
}
.overlay img { max-width: 100%; max-height: 62vh; object-fit: contain; align-self: center; background: #fff; }
.overlay .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.overlay .actions a { text-decoration: none; }
@media (max-width: 780px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; }
  html, body { height: auto; }
  .stage { order: -1; }
  .mapwrap { flex: none; height: 62vh; padding: 10px; }
  .rail { border-right: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .stagebar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Dungeon settings">
    <div class="brand">
      <h1>Dungeon Sketcher</h1>
      <p>Seeded dungeon maps you can restyle without changing the layout.</p>
    </div>

    <fieldset>
      <legend>Layout</legend>
      <div class="row"><label for="seed">Seed</label>
        <div class="seed"><input id="seed" type="text" spellcheck="false" autocomplete="off"><button id="reroll" class="primary" type="button">New</button></div>
      </div>
      <div class="row"><label for="rooms">Rooms</label>
        <div class="slide"><input id="rooms" type="range" min="3" max="60" value="14"><output for="rooms"></output></div>
      </div>
      <div class="row"><label for="layout">Arrangement</label>
        <select id="layout">
          <option value="shared">Rooms share walls</option>
          <option value="halls">Rooms joined by halls</option>
          <option value="mixed" selected>Mixed walls and halls</option>
          <option value="scattered">Scattered, winding halls</option>
        </select>
      </div>
      <div class="row"><label for="symmetry">Symmetry</label>
        <select id="symmetry">
          <option value="none" selected>Asymmetric</option>
          <option value="partial">Partly symmetric</option>
          <option value="full">Symmetric</option>
        </select>
      </div>
      <div class="row"><label for="paths">Paths</label>
        <select id="paths">
          <option value="branch" selected>Branching</option>
          <option value="mixed">Mixed</option>
          <option value="loop">Looping</option>
        </select>
      </div>
      <div class="row" id="mixRow"><label for="mix">Halls vs walls</label>
        <div class="slide"><input id="mix" type="range" min="0" max="100" value="50"><output for="mix"></output></div>
      </div>
      <div class="row" id="hallRow"><span class="lbl">Hall length</span>
        <div class="pair">
          <input id="hallMin" type="range" min="1" max="10" value="2" aria-label="Shortest hall"><output for="hallMin"></output>
          <input id="hallMax" type="range" min="1" max="14" value="6" aria-label="Longest hall"><output for="hallMax"></output>
        </div>
      </div>
      <div class="row" id="shapeRow"><label for="hallShape">Hall shape</label>
        <select id="hallShape">
          <option value="straight">Straight</option>
          <option value="bent" selected>Some bends</option>
          <option value="winding">Winding</option>
        </select>
      </div>
      <div class="row"><span class="lbl">Room size</span>
        <div class="pair">
          <input id="minSize" type="range" min="2" max="10" value="3" aria-label="Smallest room side"><output for="minSize"></output>
          <input id="maxSize" type="range" min="3" max="16" value="7" aria-label="Largest room side"><output for="maxSize"></output>
        </div>
      </div>
      <div class="row"><label for="shapes">Room shapes</label>
        <select id="shapes">
          <option value="rect">Rectangles only</option>
          <option value="some" selected>A few odd rooms</option>
          <option value="many">Many odd rooms</option>
          <option value="caves">Mostly caves</option>
        </select>
      </div>
      <div class="row"><label for="niches">Niches</label>
        <div class="slide"><input id="niches" type="range" min="0" max="100" value="30"><output for="niches"></output></div>
      </div>
      <div class="row"><label for="entrances">Entrances</label>
        <select id="entrances">
          <option value="1">One</option>
          <option value="2" selected>Two</option>
          <option value="3">Three</option>
        </select>
      </div>
      <div class="row"><label for="elevation">Elevation</label>
        <select id="elevation">
          <option value="none">None</option>
          <option value="some" selected>Some</option>
          <option value="lots">Lots</option>
        </select>
      </div>
      <div class="row"><label for="river">River</label>
        <select id="river">
          <option value="none" selected>None</option>
          <option value="some">Sometimes</option>
          <option value="always">Always</option>
        </select>
      </div>
      <div class="row"><label for="water">Water</label>
        <div class="slide"><input id="water" type="range" min="0" max="100" value="20"><output for="water"></output></div>
      </div>
      <div class="row"><label for="loops">Extra links</label>
        <div class="slide"><input id="loops" type="range" min="0" max="100" value="25"><output for="loops"></output></div>
      </div>
      <div class="row"><label for="doors">Doors</label>
        <select id="doors">
          <option value="mixed" selected>Mixed</option>
          <option value="plain">Plain doors</option>
          <option value="open">Open archways</option>
          <option value="secret">Secretive</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <div class="row"><label for="preset">Preset</label>
        <select id="preset">
          <option value="sketch" selected>Ink sketch</option>
          <option value="parchment">Parchment</option>
          <option value="classic">Old-school blue</option>
          <option value="blueprint">Blueprint</option>
          <option value="lantern">Lantern light</option>
          <option value="graph">Ink &amp; graph</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="row"><label for="walls">Walls</label>
        <select id="walls">
          <option value="ink">Solid ink</option>
          <option value="sketchy">Sketchy strokes</option>
          <option value="double">Outlined</option>
          <option value="stone">Stone blocks</option>
          <option value="fine">Fine line</option>
        </select>
      </div>
      <div class="row"><label for="weight">Wall weight</label>
        <div class="slide"><input id="weight" type="range" min="50" max="200" value="100" step="10"><output for="weight"></output></div>
      </div>
      <div class="row"><label for="floor">Floor</label>
        <select id="floor">
          <option value="plain">Plain</option>
          <option value="flagstones">Flagstones</option>
          <option value="planks">Planks</option>
          <option value="checker">Checker tiles</option>
          <option value="cobble">Cobbles</option>
        </select>
      </div>
      <div class="row"><label for="grid">Grid</label>
        <select id="grid">
          <option value="lines">Lines</option>
          <option value="dots">Dots</option>
          <option value="none">None</option>
        </select>
      </div>
      <div class="row"><label for="outside">Surroundings</label>
        <select id="outside">
          <option value="hatch">Hatching</option>
          <option value="pen">Pen hatching</option>
          <option value="cross">Cross-hatch</option>
          <option value="stipple">Stipple</option>
          <option value="solid">Solid rock</option>
          <option value="none">Bare paper</option>
        </select>
      </div>
      <div class="row"><label for="depth">Hatch depth</label>
        <div class="slide"><input id="depth" type="range" min="0.5" max="3" value="1.25" step="0.25"><output for="depth"></output></div>
      </div>
      <div class="row"><label for="cluster">Cluster size</label>
        <div class="slide"><input id="cluster" type="range" min="18" max="110" value="45" step="1"><output for="cluster"></output></div>
      </div>
      <div class="row"><label for="strokeGap">Stroke spacing</label>
        <div class="slide"><input id="strokeGap" type="range" min="3.5" max="28" value="10" step="0.5"><output for="strokeGap"></output></div>
      </div>
      <div class="row"><label for="shadow">Shadows</label>
        <select id="shadow">
          <option value="cast" selected>Cast by light</option>
          <option value="soft">Soft, all walls</option>
          <option value="none">None</option>
        </select>
      </div>
      <div class="row" id="lightRow"><label for="light">Light from</label>
        <div class="slide"><input id="light" type="range" min="0" max="345" value="315" step="15"><output for="light"></output></div>
      </div>
      <div class="row"><label for="palette">Palette</label>
        <select id="palette">
          <option value="paper">Paper</option>
          <option value="parchment">Parchment</option>
          <option value="classic">Old-school blue</option>
          <option value="blueprint">Blueprint</option>
          <option value="lantern">Lantern</option>
          <option value="graph">Graph paper</option>
        </select>
      </div>
      <div class="checks">
        <label><input id="numbers" type="checkbox" checked> Room numbers</label>
        <label><input id="decor" type="checkbox" checked> Furnishings</label>
        <label><input id="showTitle" type="checkbox" checked> Title</label>
        <label><input id="grit" type="checkbox"> Cave grit</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="row"><label for="ppi">Pixels / square</label>
        <select id="ppi">
          <option value="70">70 px</option>
          <option value="100">100 px</option>
          <option value="140" selected>140 px</option>
          <option value="200">200 px</option>
        </select>
      </div>
      <button id="export" class="primary" type="button">Export PNG</button>
      <p class="hint">One grid square is 5 ft. The same seed and layout settings always give the same dungeon.</p>
    </fieldset>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <h2 id="dname">&nbsp;</h2>
      <span class="meta" id="dmeta"></span>
    </div>
    <div class="mapwrap" id="mapwrap"><canvas id="map" aria-label="Generated dungeon map" role="img"></canvas></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-label="Exported map">
    <img id="exportImg" alt="Exported dungeon map">
    <div class="actions">
      <span class="hint" id="exportInfo"></span>
      <a id="exportLink" download="dungeon.png"><button type="button" class="primary" tabindex="-1">Download</button></a>
      <button type="button" id="closeOverlay">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
<script>
"use strict";
/* ================================================================
   Seeded random numbers
   ================================================================ */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function RNG(seed) {
  const f = mulberry32(xmur3(String(seed))());
  return {
    f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    range: (a, b) => a + f() * (b - a),
    pick: arr => arr[Math.floor(f() * arr.length)],
    chance: p => f() < p,
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
  };
}

const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // E S W N

/* ================================================================
   Room shapes
   Every room keeps a whole-square footprint (x, y, w, h) for layout,
   and draws a shape inside it: rect, chamfer (45-degree corners),
   circle, apse (one end rounded; at minimum length it is a half
   circle) or ell (a right-angled notch out of one corner).
   Polygons are in grid squares, wound clockwise on screen.
   ================================================================ */
function orient(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return a < 0 ? pts.reverse() : pts;
}
function inPoly(pts, px, py) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function inRoom(r, px, py) {
  if (r.holes && r.holes.some(hp => inPoly(hp, px, py))) return false;
  for (const p of r.poly) if (inPoly(p, px, py)) return true;
  return false;
}
const arcPts = (cx, cy, R, a0, a1, n) => { const pts = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]); } return pts; };
const circlePts = (cx, cy, R) => { const n = Math.max(32, Math.round(R * 22)), pts = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]); } return pts; };
// Solid centres ("ring" rooms): the floor runs round a block of rock.
function roomHoles(r) {
  const sh = r.shape, hole = sh && sh.hole;
  if (!hole) return [];
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  if (hole.kind === "round") return [orient(circlePts(cx, cy, hole.s / 2))];
  return [orient([[cx - hole.s / 2, cy - hole.s / 2], [cx + hole.s / 2, cy - hole.s / 2], [cx + hole.s / 2, cy + hole.s / 2], [cx - hole.s / 2, cy + hole.s / 2]])];
}
// A room's floor as a list of polygons (overlapping parts merge when filled).
function roomPoly(r) {
  const { x, y, w, h } = r, sh = r.shape || { type: "rect" };
  if (sh.type === "bars") { // cross, T or offset cross: a full-width bar plus a full-height bar
    const hb = sh.hb, vb = sh.vb;
    return [orient([[x, y + hb.y], [x + w, y + hb.y], [x + w, y + hb.y + hb.h], [x, y + hb.y + hb.h]]),
            orient([[x + vb.x, y], [x + vb.x + vb.w, y], [x + vb.x + vb.w, y + h], [x + vb.x, y + h]])];
  }
  if (sh.type === "cave") {
    return sh.circles.map(c => {
      const n = c.rad ? c.rad.length : 32, pts = [];
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, rr2 = c.rad ? c.rad[i] : c.r; pts.push([x + c.x + Math.cos(a) * rr2, y + c.y + Math.sin(a) * rr2]); }
      return orient(pts);
    });
  }
  if (sh.type === "quatrefoil") { // a square core with a half-circle lobe on each side
    const cx = x + w / 2, cy = y + h / 2, rl = w / 4, k = w / 2;
    return [orient([[cx - k / 2, cy - k / 2], [cx + k / 2, cy - k / 2], [cx + k / 2, cy + k / 2], [cx - k / 2, cy + k / 2]]),
      ...[[0, -1], [1, 0], [0, 1], [-1, 0]].map(([dx, dy]) => orient(circlePts(cx + dx * k / 2, cy + dy * k / 2, rl)))];
  }
  if (sh.type === "keyhole") { // a round chamber with a straight neck leading out of one side
    const [nx, ny] = DIRS[sh.side], D = sh.d, nw = sh.nw;
    const horiz = nx !== 0, along = horiz ? w : h, cxs = x + w / 2, cys = y + h / 2;
    // circle sits at the end away from the neck
    const cc = horiz ? [cxs - nx * (along / 2 - D / 2), cys] : [cxs, cys - ny * (along / 2 - D / 2)];
    const nb = horiz ? [[cc[0], cys - nw / 2], [nx > 0 ? x + w : x, cys - nw / 2], [nx > 0 ? x + w : x, cys + nw / 2], [cc[0], cys + nw / 2]]
      : [[cxs - nw / 2, cc[1]], [cxs + nw / 2, cc[1]], [cxs + nw / 2, ny > 0 ? y + h : y], [cxs - nw / 2, ny > 0 ? y + h : y]];
    return [orient(circlePts(cc[0], cc[1], D / 2)), orient(nb)];
  }
  let pts;

      for (const i of inTree) for (let j = 0; j < rooms.length; j++) if (!inTree.has(j)) {
        const dd = dist(rooms[i], rooms[j]);
        if (!best || dd < best[2]) best = [i, j, dd];
      }
      inTree.add(best[1]); edges.push(best);
    }
    const extra = [];
    for (let i = 0; i < rooms.length; i++) {
      const near = rooms.map((r, j) => [j, dist(rooms[i], r)]).filter(([j]) => j !== i).sort((p, q) => p[1] - q[1]).slice(0, 3);
      for (const [j] of near) if (rng.chance(o.loops * 0.45)) extra.push([i, j]);
    }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const r of rooms) { x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h); }
    const bx0 = Math.max(2, x0 - 4), by0 = Math.max(2, y0 - 4), bw = Math.min(G - 2, x1 + 4) - bx0, bh = Math.min(G - 2, y1 + 4) - by0;
    const box = [bx0, by0, bw, bh];
    if (LOOP && rooms.length >= 4) {
      // main cycle: a ring through the outer rooms (and the entrance), in angle order
      const [gx, gy] = [rooms.reduce((a, r) => a + cx(r), 0) / rooms.length, rooms.reduce((a, r) => a + cy(r), 0) / rooms.length];
      const rad = r => Math.hypot(cx(r) - gx, cy(r) - gy), med = rooms.map(rad).sort((a, b) => a - b)[Math.floor(rooms.length / 2)];
      let ring = rooms.filter((r, i) => i === 0 || rad(r) >= med).sort((a, b) => Math.atan2(cy(a) - gy, cx(a) - gx) - Math.atan2(cy(b) - gy, cx(b) - gx));
      const s0 = ring.indexOf(rooms[0]); ring = ring.slice(s0).concat(ring.slice(0, s0));
      for (let i = 0; i < ring.length; i++) carveSym(ring[i], ring[(i + 1) % ring.length], box);
      const gi = Math.floor(ring.length / 2);
      cycle = { root: ring[0].id, goal: ring[gi].id, arcs: [ring.slice(1, gi).map(r => r.id), ring.slice(gi + 1).reverse().map(r => r.id)] };
    }
    for (const [i, j] of edges) if (roomHops(rooms[i].id, rooms[j].id) === Infinity) carveSym(rooms[i], rooms[j], box);
    for (const [i, j] of extra) if (!links.has(linkKey(rooms[i].id, rooms[j].id)) && roomHops(rooms[i].id, rooms[j].id) >= 3) carveSym(rooms[i], rooms[j], box, detourLimit(rooms[i], rooms[j]));
  }
  // Repair: join any room that can't be reached from the entrance to its
  // nearest connected rooms; if its shape offers no reachable doorway, make
  // it rectangular and try again.
  function repairConnectivity() {
    const box = carveBox(6);
    const d2 = (a, b) => Math.hypot(a.x + a.w / 2 - b.x - b.w / 2, a.y + a.h / 2 - b.y - b.h / 2);
    for (let pass = 0; pass < 3; pass++) {
      const lost = rooms.filter(r => roomHops(rooms[0].id, r.id) === Infinity);
      if (!lost.length) return;
      for (const r of lost) {
        if (roomHops(rooms[0].id, r.id) < Infinity) continue;
        const near = rooms.filter(q => q !== r && roomHops(rooms[0].id, q.id) < Infinity).sort((a, b) => d2(a, r) - d2(b, r)).slice(0, 6);

  /* ---------- Niches: recesses cut into straight stretches of wall ---------- */

    if (o.niches <= 0) return;
    const nr = RNG(o.seed + "|niches");
    const isClear = (nx, ny, sx, sy) => {
      if (get(nx, ny) !== 0) return false;
      for (const [ax, ay] of DIRS) { const qx = nx + ax, qy = ny + ay; if (qx === sx && qy === sy) continue; if (get(qx, qy) !== 0) return false; }
      return true;
    };
    for (const r of rooms) {
      if (r.mirror && r.twin) continue; // gets its twin's niches
      if (!nr.chance(o.niches)) continue;

      const want = nr.int(1, Math.max(1, Math.round((r.w + r.h) / 4)));
      const placeNiche = (sx, sy, d) => {
        const nx = sx + DIRS[d][0], ny = sy + DIRS[d][1];
        grid[I(nx, ny)] = r.id;
        niches.push({ room: r.id, x: nx, y: ny, d, kind });
        const t = SYM !== "none" ? twinOf(r) : null;
        if (t && mx(nx) !== nx) { // the matching niche across the axis
          const mnx = mx(nx), msx = mx(sx), md = mDir(d);
          if (get(msx, sy) === t.id && doorOK(t, msx, sy, md) && !doors.has(edgeKey(msx, sy, mnx, ny)) && isClear(mnx, ny, msx, sy)) {
            grid[I(mnx, ny)] = t.id; niches.push({ room: t.id, x: mnx, y: ny, d: md, kind });
          }
        }
      };
      // Patterned (about half the time): niches centred and evenly spaced on
      // one wall, often repeated on the facing wall so they sit opposite each other.
      const style = nr.f();
      if (style < 0.55) {
        const usable = d => { // along-wall position -> side cell, for cells a niche could go in
          const m = new Map();
          for (const [sx, sy] of sideCells(r, d)) {
            const nx = sx + DIRS[d][0], ny = sy + DIRS[d][1];
            if (!doors.has(edgeKey(sx, sy, nx, ny)) && isClear(nx, ny, sx, sy)) m.set(d % 2 === 0 ? sy : sx, [sx, sy]);
          }

        };
        const facing = style < 0.33;
        for (const d of nr.shuffle([0, 1, 2, 3])) {
          const span = d % 2 === 0 ? r.h : r.w, start = d % 2 === 0 ? r.y : r.x, mid = start + (span - 1) / 2;
          const here = usable(d), there = facing ? usable((d + 2) % 4) : null;
          // Spread k niches evenly with the end gaps about half the middle gaps
          // (e.g. 1, 2, 1 squares on a six-square wall), kept symmetric about the
          // wall's centre; take the closest arrangement that fits.
          let chosen = null;
          for (let k = Math.min(3, want + 1); k >= 1 && !chosen; k--) {
            const ideal = Array.from({ length: k }, (_, n) => start + span * (2 * n + 1) / (2 * k) - 0.5);
            let best = null;
            for (let g = k === 1 ? 0 : 2; g <= (k === 1 ? 0 : span); g++) {
              const at = Array.from({ length: k }, (_, n) => mid + (n - (k - 1) / 2) * g);
              if (!at.every(a => Number.isInteger(a) && here.has(a) && (!facing || there.has(a)))) continue;
              const err = at.reduce((e2, a, n) => e2 + Math.abs(a - ideal[n]), 0);
              if (!best || err < best.err) best = { at, err };
            }
            if (best && best.err <= 0.6 * k) chosen = best.at;
          }
          if (!chosen) continue;
          for (const a of chosen) {
            placeNiche(...here.get(a), d);
            if (facing) placeNiche(...there.get(a), (d + 2) % 4);
          }
          break;
        }
        continue;
      }
      const cand = [];
      for (let d = 0; d < 4; d++) for (const [sx, sy] of sideCells(r, d)) {
        const nx = sx + DIRS[d][0], ny = sy + DIRS[d][1];
        if (!doors.has(edgeKey(sx, sy, nx, ny))) cand.push([sx, sy, d, nx, ny]);
      }
      nr.shuffle(cand);
      let made = 0;
      for (const [sx, sy, d, nx, ny] of cand) {
        if (made >= want) break;
        if (!isClear(nx, ny, sx, sy)) continue;
        placeNiche(sx, sy, d);
        made++;
      }
    }
  }

  if (o.layout === "scattered") scatter();
  else {
    if (LOOP) growLooping();
    else { makeRoot(); if (SYM !== "none") growSymmetric(o.rooms); else grow(o.rooms); }
    addLoops();
  }
  repairConnectivity();
  gateCycle();
  addNiches();

  /* ---------- Number rooms in walking order from the entrance ---------- */
  const adj = rooms.map(() => []);
  for (const k of links) { const [a, b] = k.split("-").map(Number); adj[a - 1].push(b - 1); adj[b - 1].push(a - 1); }
  const depth = rooms.map(() => -1); const order = [];
  if (rooms.length) {
    depth[0] = 0; const q = [0];
    while (q.length) { const i = q.shift(); order.push(i); for (const j of adj[i].sort((a, b) => a - b)) if (depth[j] < 0) { depth[j] = depth[i] + 1; q.push(j); } }
    rooms.forEach((r, i) => { if (depth[i] < 0) { depth[i] = 0; order.push(i); } });
  }
  order.forEach((i, n) => { rooms[i].num = n + 1; rooms[i].depth = depth[i]; });

  /* ---------- Crop ---------- */
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) if (grid[I(x, y)] !== 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const M = 4;
  const ox = x0 - M, oy = y0 - M, W = x1 - x0 + 1 + M * 2, H = y1 - y0 + 1 + M * 2;
  const cells = new Int16Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) cells[y * W + x] = grid[I(x + ox, y + oy)];
  const outRooms = rooms.map(r => ({ id: r.id, num: r.num, depth: r.depth, x: r.x - ox, y: r.y - oy, w: r.w, h: r.h, shape: r.shape, axis: !!r.axis, twin: r.twin, primary: !!r.primary, mirror: !!r.mirror }));
  const outDoors = [...doors.values()].map(d => ({ o: d.o, x: d.x - ox, y: d.y - oy, type: d.type }));
  const outNiches = niches.map(n => ({ ...n, x: n.x - ox, y: n.y - oy }));
  const tunnels = new Uint8Array(W * H);
  for (const gi of tunnelCells) if (!builtCells.has(gi)) { const x = gi % G - ox, y = Math.floor(gi / G) - oy; if (x >= 0 && y >= 0 && x < W && y < H && cells[y * W + x] === -1) tunnels[y * W + x] = 1; }
  const map = { W, H, cells, tunnels, rooms: outRooms, doors: outDoors, niches: outNiches, seed: o.seed };
  addEntrances(map, o, rooms[0] ? rooms[0].id : 1);
  addRiver(map, o, rooms[0] ? rooms[0].id : 1, SYM !== "none" ? AX - ox : null);
  buildGeometry(map);
  if (map.river) for (const r of map.rooms) if ([[0, 0], [0, -0.45], [0, 0.45], [-0.45, 0], [0.45, 0]].some(([a, b]) => map.wetAt(r.lx + a, r.ly + b))) { // move a drowned room number to dry floor
    let best = null;
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
      const px = x + 0.5, py = y + 0.5;
      if (!inRoom(r, px, py) || map.wetAt(px, py) || map.wetAt(px, py - 0.6) || map.wetAt(px, py + 0.6)) continue;
      const sc = -Math.hypot(px - r.x - r.w / 2, py - r.y - r.h / 2);
      if (!best || sc > best[0]) best = [sc, px, py];
    }
    if (best) [r.lx, r.ly] = [best[1], best[2]];
  }
  map.linkKinds = [...linkKind.values()];
  if (cycle && rooms[cycle.goal - 1]) { map.cycle = cycle; map.goal = cycle.goal; map.keyRoom = cycle.keyRoom; }
  map.features = furnish(map, o.seed);
  map.lakes = addLakes(map, o.seed, o.water);
  if (SYM !== "none") mirrorDecor(map, AX - ox);
  addElevation(map, o, SYM !== "none" ? AX - ox : null);
  map.title = dungeonName(o.seed);
  return map;
}

/* Elevation within a level (Dyson Logos's ledges, daises and stairs
   inside a level): raised daises against a doorless wall (or filling the
   curved end of an apse), ledges across caves with carved steps through
   them, and short flights of steps partway along straight halls. None of
   them change where you can walk, so connectivity is untouched.
   Features: { type: "dais", pts, front: [[x0,y0,x1,y1]...] },
   { type: "ledge", pts, low: +1|-1, gap: [t0, t1] },
   { type: "steps", x, y, d }. x, y is an anchor for overlap checks. */
function addElevation(map, o, axC) {
  const level = o.elevation || "none";
  if (level === "none") return;
  const rng = RNG(o.seed + "|elevation");
  const lots = level === "lots";
  const { W, H, cells, rooms } = map;
  const at = (x, y) => x < 0 || y < 0 || x >= W || y >= H ? 0 : cells[y * W + x];
  const doorEdges = new Set(map.doors.map(d => d.o + d.x + "," + d.y));
  const nicheCells = new Set((map.niches || []).map(n => n.x + "," + n.y));
  const feats = map.features;
  const busy = (x, y, rad) => // anything already there?
    feats.some(f => (f.type === "stairs" ? Math.hypot(f.x + 0.5 - x, f.y + 0.5 - y) : Math.hypot(f.x - x, f.y - y)) < rad + (f.type === "pool" ? f.r : f.type === "stairs" ? 0.75 : 0.35))
    || (map.lakes || []).some(l => l.blobs.some(b => inPoly(b, x, y))) || (map.wetAt && map.wetAt(x, y));
  const mirrorPts = pts => pts.map(([x, y]) => [2 * axC + 1 - x, y]);
  const twinOfRoom = r => r.twin ? rooms.find(q => q.id === r.twin) : null;
  const add = (f, room) => {
    feats.push(f);
    if (axC === null || !room || !room.primary) return;
    const t = twinOfRoom(room); if (!t) return;
    const m = { ...f, x: 2 * axC + 1 - f.x, pts: f.pts && mirrorPts(f.pts).reverse() };
    if (f.front) m.front = f.front.map(([x0, y0, x1, y1]) => [2 * axC + 1 - x0, y0, 2 * axC + 1 - x1, y1]);
    if (f.d !== undefined) m.d = f.d === 0 ? 2 : f.d === 2 ? 0 : f.d;
    feats.push(m);
  };
  for (const r of rooms) {
    if (axC !== null && r.mirror && r.twin) continue; // gets its twin's
    const t = r.shape.type;
    // ---- daises ----
    if ((t === "rect" || t === "roundrect" || (t === "chamfer" && r.shape.c === 1) || t === "apse") && !r.shape.hole && Math.min(r.w, r.h) >= 5
      && rng.chance(lots ? 0.45 : 0.22)) {
      if (t === "apse") { // the curved end becomes a raised half-round
        const sd = r.shape.side, [nx, ny] = DIRS[sd], span = nx ? r.h : r.w, R = span / 2, along = nx ? r.w : r.h;
        if (axC !== null && r.axis && nx !== 0) continue;
        const cx = r.x + r.w / 2 + nx * (along / 2 - R), cy = r.y + r.h / 2 + ny * (along / 2 - R), rd = R - 0.9;
        if (rd < 1.2) continue;
        const a0 = Math.atan2(ny, nx), pts = [];
        for (let k = 0; k <= 16; k++) { const a = a0 - Math.PI / 2 + Math.PI * k / 16; pts.push([cx + Math.cos(a) * rd, cy + Math.sin(a) * rd]); }
        const tx = -ny, ty = nx, front = [];
        for (const off of [0.18, 0.36]) front.push([cx - tx * rd - nx * off, cy - ty * rd - ny * off, cx + tx * rd - nx * off, cy + ty * rd - ny * off]);
        if (pts.some(([x, y]) => busy(x, y, 0.2)) || busy(cx, cy, 0.6) || Math.hypot(r.lx - cx, r.ly - cy) < rd + 0.4) continue;
        add({ type: "dais", x: cx, y: cy, pts, front }, r);
        continue;
      }
      // against a doorless, nicheless wall, centred, a square or two deep
      const sides = rng.shuffle([0, 1, 2, 3]).filter(d => {
        if (axC !== null && r.axis && d % 2 === 0) return false; // axis rooms: only daises that are symmetric
        const [nx, ny] = DIRS[d];
        for (let k = 0; k < (nx ? r.h : r.w); k++) {
          const x = nx > 0 ? r.x + r.w - 1 : nx < 0 ? r.x : r.x + k, y = ny > 0 ? r.y + r.h - 1 : ny < 0 ? r.y : r.y + k;
          const key = nx ? "v" + (nx > 0 ? x + 1 : x) + "," + y : "h" + x + "," + (ny > 0 ? y + 1 : y);
          if (doorEdges.has(key) || nicheCells.has((x + nx) + "," + (y + ny))) return false;
        }
        return true;
      });
      for (const d of sides) {
        const [nx, ny] = DIRS[d], len = nx ? r.h : r.w, deep = nx ? r.w : r.h;
        let wd = Math.max(3, Math.round(len * 0.5)); if ((len - wd) % 2) wd--; if (wd < 2 || len - wd < 2) continue;
        const dp = deep >= 8 ? 2 : 1;
        const s0 = (len - wd) / 2;
        const wallU = nx > 0 ? r.x + r.w : nx < 0 ? r.x : ny > 0 ? r.y + r.h : r.y;
        const frontU = wallU - (nx || ny) * dp;
        const pts = nx ? [[wallU, r.y + s0], [frontU, r.y + s0], [frontU, r.y + s0 + wd], [wallU, r.y + s0 + wd]]
                       : [[r.x + s0, wallU], [r.x + s0, frontU], [r.x + s0 + wd, frontU], [r.x + s0 + wd, wallU]];
        const inward = -(nx || ny), front = [];
        for (const off of [0.18, 0.36]) front.push(nx ? [frontU + inward * off, r.y + s0 + 0.3, frontU + inward * off, r.y + s0 + wd - 0.3]
                                                     : [r.x + s0 + 0.3, frontU + inward * off, r.x + s0 + wd - 0.3, frontU + inward * off]);
        const cx = (pts[0][0] + pts[2][0]) / 2, cy = (pts[0][1] + pts[2][1]) / 2;
        let clash = false;
        for (let u = 0.25; u < wd && !clash; u += 0.5) for (let v = 0.25; v < dp + 0.5 && !clash; v += 0.5) {
          const px = nx ? wallU - (nx * v) : r.x + s0 + u, py = nx ? r.y + s0 + u : wallU - (ny * v);
          if (busy(px, py, 0.15)) clash = true;
        }
        if (clash || Math.hypot(r.lx - cx, r.ly - cy) < Math.max(wd, dp) / 2 + 0.7) continue;
        add({ type: "dais", x: cx, y: cy, pts: orient(pts), front }, r);
        break;
      }
    }
    // ---- cave ledges ----
    if (t === "cave" && r.w * r.h >= 30 && rng.chance(lots ? 0.7 : 0.4)) {
      for (let tries = 0; tries < 12; tries++) {
        const ang = rng.range(0, Math.PI), ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
        const off = rng.range(-Math.min(r.w, r.h) * 0.22, Math.min(r.w, r.h) * 0.22);
        const cx = r.x + r.w / 2 + nx * off, cy = r.y + r.h / 2 + ny * off;
        if (Math.abs((r.lx - cx) * nx + (r.ly - cy) * ny) < 1.1) continue; // keep the number off the ledge
        const pts = []; let v = 0;
        for (let tt = -Math.max(r.w, r.h); tt <= Math.max(r.w, r.h); tt += 0.25) {
          v = v * 0.8 + rng.range(-0.06, 0.06);
          const px = cx + ux * tt + nx * v, py = cy + uy * tt + ny * v;
          if (inRoom(r, px, py) && map.floorAt(px, py)) pts.push([px, py]);
          else if (pts.length) break;
        }
        if (pts.length < 12 || pts.some(([x, y]) => busy(x, y, 0.25))) continue;
        const g0 = Math.floor(pts.length * rng.range(0.3, 0.6)), g1 = Math.min(pts.length - 1, g0 + 4); // a square-wide flight of steps
        add({ type: "ledge", x: cx, y: cy, pts, low: rng.chance(0.5) ? 1 : -1, gap: [g0, g1] }, r);
        break;
      }
    }
  }
  // ---- steps in halls ----
  const straight = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (cells[i] !== -1 || (map.tunnels && map.tunnels[i]) || (map.wet && map.wet[i])) continue;
    const e = at(x + 1, y) !== 0 && at(x - 1, y) !== 0 && at(x, y - 1) === 0 && at(x, y + 1) === 0;
    const n = at(x, y + 1) !== 0 && at(x, y - 1) !== 0 && at(x - 1, y) === 0 && at(x + 1, y) === 0;
    if (!e && !n) continue;
    // the hall must go on a square either way (not a room or door right there)
    if (e && (at(x + 1, y) !== -1 || at(x - 1, y) !== -1)) continue;
    if (n && (at(x, y + 1) !== -1 || at(x, y - 1) !== -1)) continue;
    if (axC !== null && x < axC) continue; // symmetric maps: placed on the right, mirrored
    straight.push([x, y, e ? (rng.chance(0.5) ? 0 : 2) : (rng.chance(0.5) ? 1 : 3)]);
  }
  rng.shuffle(straight);
  const want = Math.max(1, Math.round(rooms.length / (lots ? 4 : 8)));
  const placed = [];
  for (const [x, y, d] of straight) {
    if (placed.length >= want) break;
    if (placed.some(([px, py]) => Math.hypot(px - x, py - y) < 5) || busy(x + 0.5, y + 0.5, 0.4)) continue;
    placed.push([x, y]); feats.push({ type: "steps", x, y, d });
    if (axC !== null) { const mx2 = 2 * axC - x; if (mx2 !== x && at(mx2, y) === -1) feats.push({ type: "steps", x: mx2, y, d: d === 0 ? 2 : d === 2 ? 0 : d }); }
  }
}

/* Rivers: a meandering band of water across the whole map, cutting
   through rooms, halls and rock. Then crossings are added only where they
   join parts of the dungeon the river has cut off from each other: a bridge
   where the river crosses a built room or hall, a ford in caves and tunnels.
   If the river would leave any room unreachable it is tried again elsewhere.
   Cells: rock the river passes through becomes -2 (a channel); map.wet is
   1 for water and 2 for a crossing. */
function addRiver(map, o, firstId, axC) {
  if (!o.river || o.river === "none") return;
  const rng = RNG(o.seed + "|river");
  if (o.river === "some" && !rng.chance(0.5)) return;
  const { W, H, cells, rooms, doors } = map;
  const caveIds = new Set(rooms.filter(r => r.shape.type === "cave").map(r => r.id));

// In symmetric layouts, furnishings and lakes are copied from each room to

      if (near(r.lx, r.ly, 0.8)) continue;
      if (map.features.some(f => f.type === "stairs" ? near(f.x + 0.5, f.y + 0.5, 0.9) : near(f.x, f.y, 0.5))) continue;
      lakes.push({ room: r.id, blobs: blobs.map(b => orient(b.map(([px, py]) => [px, py]))) });
      break;
    }
  }
  return lakes;
}

function dungeonName(seed) {

  const adj = ["Ashen", "Drowned", "Hollow", "Silent", "Gilded", "Weeping", "Forgotten", "Sunken", "Crimson", "Pale", "Shattered", "Mouldering", "Starless", "Iron", "Bitter"];
  const noun = ["King", "Moth", "Abbot", "Serpent", "Lantern", "Widow", "Choir", "Tide", "Bell", "Hound", "Archivist", "Thorn", "Oath", "Saint", "Jackal"];
  const names = ["Varro", "Ilsabet", "Grimwold", "Oszkar", "Thessaly", "Morven", "Quillon", "Ebbe", "Hathra", "Corwen"];
  switch (rng.int(0, 3)) {
    case 0: return "The " + rng.pick(place) + " of the " + rng.pick(adj) + " " + rng.pick(noun);

}

/* ================================================================
   Hatching geometry
   Technique after Watabou's hatching for One Page Dungeon, as written up
   by Red Blob Games ("Dyson hatching"): scatter Poisson-disc points in a
   band along the walls, give each point its Voronoi cell, and fill each
   cell with a cluster of parallel strokes clipped to the cell. Cells are
   pulled in from their shared edges, so clusters never overlap.
   All geometry is in grid squares, so screen and export match exactly.
   ================================================================ */
function floorDistance(map) {
  const { R, mw, mh, floorD2 } = map;
  return function (px, py) {
    const fx = Math.min(mw - 1, Math.max(0, Math.floor(px * R))), fy = Math.min(mh - 1, Math.max(0, Math.floor(py * R)));
    return Math.sqrt(floorD2[fy * mw + fx]) / R;
  };
}

// Dart-throwing Poisson-disc sampler over the band 0 < distance <= limit(rng).
function bandPoints(map, rng, spacing, accept, near) {
  const { W, H } = map;
  const cs = spacing / Math.SQRT2, gw = Math.ceil(W / cs) + 1, gh = Math.ceil(H / cs) + 1;
  const grid = new Int32Array(gw * gh).fill(-1);
  const pts = [];
  const free = (x, y) => {
    const gx = Math.floor(x / cs), gy = Math.floor(y / cs);
    for (let yy = Math.max(0, gy - 2); yy <= Math.min(gh - 1, gy + 2); yy++)
      for (let xx = Math.max(0, gx - 2); xx <= Math.min(gw - 1, gx + 2); xx++) {
        const i = grid[yy * gw + xx];
        if (i >= 0) { const q = pts[i]; if ((q.x - x) ** 2 + (q.y - y) ** 2 < spacing * spacing) return false; }
      }
    return true;
  };
  const order = [];
  const solid = (x, y) => map.floorAt(x + 0.05, y + 0.05) && map.floorAt(x + 0.95, y + 0.05) && map.floorAt(x + 0.05, y + 0.95) && map.floorAt(x + 0.95, y + 0.95) && map.floorAt(x + 0.5, y + 0.5);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!solid(x, y) && near(x + 0.5, y + 0.5)) order.push([x, y]);
  rng.shuffle(order);
  const tries = Math.min(160, Math.max(10, Math.ceil(3.5 / (spacing * spacing))));
  for (let pass = 0; pass < 2; pass++) for (const [x, y] of order) {
    for (let k = 0; k < tries; k++) {
      const px = x + rng.f(), py = y + rng.f();
      if (!accept(px, py) || !free(px, py)) continue;
      grid[Math.floor(py / cs) * gw + Math.floor(px / cs)] = pts.length;
      pts.push({ x: px, y: py });
    }
  }
  return { pts, grid, gw, gh, cs };
}

function clipHalfPlane(poly, px, py, ux, uy, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const fa = (a[0] - px) * ux + (a[1] - py) * uy - c, fb = (b[0] - px) * ux + (b[1] - py) * uy - c;
    if (fa <= 0) out.push(a);
    if ((fa <= 0) !== (fb <= 0)) { const t = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}

function hatchCells(map, depth, size) {
  const key = depth + "|" + size;
  map._hatch = map._hatch || {};
  if (map._hatch[key]) return map._hatch[key];
  const rng = RNG(map.seed + "|hatch|" + key);
  const dist = floorDistance(map);
  const spacing = size;                 // closest two cluster centres may be, in squares
  const { pts, grid, gw, gh, cs } = bandPoints(map, rng, spacing, (x, y) => {
    const d = dist(x, y);
    return d > 0 && (d <= depth * (0.72 + 0.42 * rng.f()) || map.inHole(x, y)); // ragged outer edge; solid centres filled
  }, (x, y) => dist(x, y) <= depth * 1.14 + 0.71 || map.inHole(x, y));
  const gap = Math.max(0.022, 0.045 * Math.min(1, size / 0.62)), maxR = spacing * 1.53, reach = Math.ceil((maxR * 2) / cs);
  const cells = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    let poly = [];
    for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2 + 0.3; poly.push([p.x + Math.cos(a) * maxR, p.y + Math.sin(a) * maxR]); }
    const gx = Math.floor(p.x / cs), gy = Math.floor(p.y / cs);
    const nbrs = [];
    for (let yy = Math.max(0, gy - reach); yy <= Math.min(gh - 1, gy + reach); yy++)
      for (let xx = Math.max(0, gx - reach); xx <= Math.min(gw - 1, gx + reach); xx++) {
        const j = grid[yy * gw + xx];
        if (j < 0 || j === i) continue;
        const q = pts[j], dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy);
        if (L > maxR * 2) continue;
        nbrs.push(j);
        poly = clipHalfPlane(poly, p.x, p.y, dx / L, dy / L, L / 2 - gap);
        if (poly.length < 3) break;
      }
    if (poly.length < 3) continue;
    cells.push({ x: p.x, y: p.y, poly, nbrs, i });
  }
  // Pick each cluster's angle to differ from its neighbours' as much as possible.
  const angleOf = new Map();
  for (const c of cells) {
    let bestA = 0, bestScore = -1;
    for (let t = 0; t < 4; t++) {
      const a = rng.f() * Math.PI;
      let score = Math.PI;
      for (const j of c.nbrs) if (angleOf.has(j)) {
        let d = Math.abs(a - angleOf.get(j)) % Math.PI; d = Math.min(d, Math.PI - d);
        score = Math.min(score, d);
      }
      if (score > bestScore) { bestScore = score; bestA = a; }
    }
    c.angle = bestA; angleOf.set(c.i, bestA);
  }
  map._hatch[key] = cells;
  return cells;
}

// Strokes of a cluster: parallel lines across a convex cell at a given angle and spacing.
function clusterStrokes(c, angle, step) {
  const minLen = Math.min(0.08, step * 0.8);
  const ux = Math.cos(angle), uy = Math.sin(angle), nx = -uy, ny = ux;
  let tmin = Infinity, tmax = -Infinity;
  for (const [x, y] of c.poly) { const t = (x - c.x) * nx + (y - c.y) * ny; if (t < tmin) tmin = t; if (t > tmax) tmax = t; }
  const out = [];
  const count = Math.floor((tmax - tmin) / step);
  const start = (tmin + tmax) / 2 - (count * step) / 2;
  for (let k = 0; k <= count; k++) {
    const t = start + k * step;
    let smin = Infinity, smax = -Infinity;
    for (let e = 0; e < c.poly.length; e++) {
      const a = c.poly[e], b = c.poly[(e + 1) % c.poly.length];
      const da = (a[0] - c.x) * nx + (a[1] - c.y) * ny - t, db = (b[0] - c.x) * nx + (b[1] - c.y) * ny - t;
      if ((da <= 0) === (db <= 0)) continue;
      const f = da / (da - db), ix = a[0] + (b[0] - a[0]) * f, iy = a[1] + (b[1] - a[1]) * f;
      const sv = (ix - c.x) * ux + (iy - c.y) * uy;
      if (sv < smin) smin = sv; if (sv > smax) smax = sv;
    }
    if (smax - smin < minLen) continue;
    const ox = c.x + nx * t, oy = c.y + ny * t;
    out.push([ox + ux * smin, oy + uy * smin, ox + ux * smax, oy + uy * smax]);
  }
  return out;
}

function stippleDots(map, depth) {
  map._stipple = map._stipple || {};
  if (map._stipple[depth]) return map._stipple[depth];
  const rng = RNG(map.seed + "|stipple|" + depth);
  const dist = floorDistance(map);
  // dense against the wall, thinning out with distance; dots never touch
  const { pts } = bandPoints(map, rng, 0.11, (x, y) => {
    const d = dist(x, y);
    if (d <= 0) return false;
    if (map.inHole(x, y)) return rng.f() < 0.5;
    if (d > depth) return false;
    return rng.f() < Math.pow(1 - d / depth, 1.6);
  }, (x, y) => dist(x, y) <= depth + 0.71 || map.inHole(x, y));
  for (const p of pts) p.r = 0.022 + rng.f() * 0.022;
  map._stipple[depth] = pts;
  return pts;
}

let noiseCanvas = null;
function noisePattern(ctx) {
  if (!noiseCanvas) {
    noiseCanvas = document.createElement("canvas"); noiseCanvas.width = noiseCanvas.height = 192;
    const n = noiseCanvas.getContext("2d"); const img = n.createImageData(192, 192); const r = RNG("paper-grain");
    for (let i = 0; i < img.data.length; i += 4) { const v = r.f() < 0.5 ? 0 : 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = Math.floor(r.f() * 14); }
    n.putImageData(img, 0, 0);

}

/* Shadows are computed on the fine floor mask, then scaled up smoothly.
   Blockers are everything that is not floor, plus interior walls and
   solid furnishings. "cast" marks floor whose path toward the light hits
   a blocker within half a square; "soft" darkens floor near any blocker. */
function shadowLayer(map, st, runs, wallSq, k, pal) {
  const key = [st.shadow, st.light, wallSq.toFixed(3), k, st.decor, pal.shadow].join("|");
  if (map._shadowKey === key) return map._shadowCanvas;
  const { R, mw, mh, mask } = map;
  const c = document.createElement("canvas"); c.width = mw; c.height = mh;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, mw, mh);
  g.globalCompositeOperation = "destination-out";
  const fp = new Path2D(); for (const p of map.polys) tracePoly(fp, p, R);
  g.fill(fp);
  g.globalCompositeOperation = "source-over";
  if (map.holes && map.holes.length) { const hp = new Path2D(); for (const p of map.holes) tracePoly(hp, p, R); g.fillStyle = "#000"; g.fill(hp); }
  g.strokeStyle = "#000"; g.lineCap = "butt"; g.lineWidth = Math.max(1, wallSq * R);
  for (const wm of [1, 2]) {
    g.lineWidth = Math.max(1, wallSq * R * wm);
    g.beginPath(); for (const [x0, y0, x1, y1, m] of runs) if ((m || 1) === wm) { g.moveTo(x0 * R, y0 * R); g.lineTo(x1 * R, y1 * R); } g.stroke();
  }
  if (st.decor) {
    g.beginPath();
    for (const f of map.features) {
      if (f.type === "column") { g.moveTo((f.x + 0.2) * R, f.y * R); g.arc(f.x * R, f.y * R, 0.2 * R, 0, Math.PI * 2); }
      else if (f.type === "bust") { g.moveTo((f.x + 0.15) * R, f.y * R); g.arc(f.x * R, f.y * R, 0.15 * R, 0, Math.PI * 2); }
      else if (f.type === "statue") g.rect((f.x - 0.3) * R, (f.y - 0.3) * R, 0.6 * R, 0.6 * R);
    }
    g.fill();
  }
  const px = g.getImageData(0, 0, mw, mh).data, block = new Uint8Array(mw * mh);
  for (let i = 0; i < block.length; i++) block[i] = px[i * 4 + 3] >= 128 ? 1 : 0;
  const out = g.createImageData(mw, mh), od = out.data;
  if (st.shadow === "cast") {
    const th = st.light * Math.PI / 180, lx = Math.sin(th), ly = -Math.cos(th); // toward the light
    const L = 0.5 * R * Math.max(0.8, k);
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
      const i = y * mw + x;
      if (block[i] || !mask[i]) continue;
      for (let s2 = 0.5; s2 <= L; s2 += 0.5) {
        const sx = Math.floor(x + 0.5 + lx * s2), sy = Math.floor(y + 0.5 + ly * s2);
        if (sx < 0 || sy < 0 || sx >= mw || sy >= mh || block[sy * mw + sx]) { od[i * 4 + 3] = s2 <= L * 0.5 ? 255 : 140; break; }
      }
    }
  } else {
    const d2 = edt(block, mw, mh, 1);
    for (let i = 0; i < block.length; i++) {
      if (block[i] || !mask[i]) continue;
      const d = Math.sqrt(d2[i]) / R, a = Math.max(0, 1 - d / 0.42);
      od[i * 4 + 3] = Math.round(Math.pow(a, 1.3) * 255);
    }
  }
  g.putImageData(out, 0, 0);
  g.globalCompositeOperation = "source-in"; g.fillStyle = pal.shadow; g.fillRect(0, 0, mw, mh);
  map._shadowKey = key; map._shadowCanvas = c;
  return c;

function renderMap(canvas, map, st, S) {
  const pal = PALETTES[st.palette];
  const rr = RNG(map.seed + "|ink");
  const { W, H, cells } = map;
  const titleRows = st.title ? 3 : 0;
  canvas.width = Math.round(W * S); canvas.height = Math.round((H + titleRows) * S);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.lineJoin = "miter";
  const at = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 0 : cells[y * W + x];
  const isFloor = (x, y) => at(x, y) !== 0;
  const j = a => rr.range(-a, a) * S;

  // paper
  ctx.fillStyle = st.outside === "solid" ? pal.rock : pal.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (st.title) {
    ctx.fillStyle = st.outside === "solid" ? pal.floor : pal.ink;
    ctx.font = `700 ${S * 1.25}px "Alegreya SC", Georgia, serif`;
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.fillText(map.title, S * 1.2, S * 1.9);
    ctx.translate(0, titleRows * S);
  }

  const floorPath = new Path2D();
  if (map.outline) { // merged outline: outer rings one way, holes the other, so non-zero fills leave holes empty
    for (const poly of map.outline) poly.forEach((ring, ri) => { const pts = orient(ring.slice(0, -1).map(([x, y]) => [x, y])); tracePoly(floorPath, ri ? pts.reverse() : pts, S); });
  } else for (const poly of map.polys) tracePoly(floorPath, poly, S);
  const k = st.weight / 100;
  const wallW = st.walls === "fine" ? Math.max(1.5, S * 0.07 * k)
    : st.walls === "double" || st.walls === "stone" ? S * 0.2 * k
    : st.walls === "sketchy" ? S * 0.13 * k : S * 0.17 * k;
  const edgeW = Math.max(1.2, S * 0.045 * k); // ink edge of outlined and stone walls

  // ---- surroundings ----
  ctx.lineCap = "round";
  if (st.outside === "hatch" || st.outside === "cross" || st.outside === "pen") {
    const cross = st.outside === "cross", pen = st.outside === "pen";
    const step = st.strokeGap;
    // line weight and wobble shrink with the spacing, so tight hatching stays crisp
    ctx.strokeStyle = pal.ink; ctx.lineWidth = Math.max(0.5, S * Math.min(cross ? 0.024 : pen ? 0.036 : 0.03, step * (pen ? 0.38 : 0.32)));
    ctx.beginPath();
    const jit = Math.min(0.035, step * 0.22);
    for (const c of hatchCells(map, st.depth, st.cluster)) {
      const sets = cross ? [[c.angle, step * 1.5], [c.angle + Math.PI / 2, step * 1.5]] : [[c.angle, step]];
      for (const [a, step] of sets) for (let [x0, y0, x1, y1] of clusterStrokes(c, a, step)) {
        if (pen) { // hand-drawn: each stroke a little shorter at a random end, and slightly off-angle
          const dx = x1 - x0, dy = y1 - y0, t0 = rr.range(0, 0.18), t1 = rr.range(0, 0.18), tw = rr.range(-0.04, 0.04);
          [x0, y0, x1, y1] = [x0 + dx * t0 - dy * tw, y0 + dy * t0 + dx * tw, x1 - dx * t1 + dy * tw, y1 - dy * t1 - dx * tw];
        }
        ctx.moveTo((x0 + rr.range(-jit, jit)) * S, (y0 + rr.range(-jit, jit)) * S);
        ctx.lineTo((x1 + rr.range(-jit, jit)) * S, (y1 + rr.range(-jit, jit)) * S);
      }
    }
    ctx.stroke();
  } else if (st.outside === "stipple") {
    ctx.fillStyle = pal.ink;
    ctx.beginPath();
    for (const p of stippleDots(map, st.depth)) { ctx.moveTo((p.x + p.r) * S, p.y * S); ctx.arc(p.x * S, p.y * S, Math.max(0.5, p.r * S), 0, Math.PI * 2); }
    ctx.fill();
  } else if (st.outside === "solid") {
    // darker rim on the rock face; the floor drawn next covers the inner half
    ctx.strokeStyle = "rgba(0,0,0,.08)"; ctx.lineWidth = S * 1.6; ctx.lineJoin = "round"; ctx.stroke(floorPath);
  }

  // ---- floor ----
  ctx.fillStyle = pal.floor; ctx.fill(floorPath);

  ctx.lineCap = "butt";
  if (st.floor === "checker") {
    ctx.fillStyle = pal.floorAlt;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if ((x + y) % 2 === 0 && isFloor(x, y)) ctx.fillRect(x * S, y * S, S, S);
  } else if (st.floor === "flagstones") {
    ctx.strokeStyle = pal.detail; ctx.lineWidth = Math.max(1, S * 0.022);

        ctx.lineWidth = Math.max(1, S * 0.035); ctx.lineCap = "round"; ctx.beginPath();
        ctx.moveTo(cx - dx * a * 1.4, cy - dy * a * 1.4); ctx.lineTo(cx + dx * a * 1.4, cy + dy * a * 1.4);
        ctx.moveTo(cx + dx * a * 1.4 - (dx * a + dy * a), cy + dy * a * 1.4 - (dy * a - dx * a)); ctx.lineTo(cx + dx * a * 1.4, cy + dy * a * 1.4);

          const pinch = f.down ? 0.08 + 0.3 * (1 - t) : 0.08; // descending stairs narrow toward the wall
          if (dx !== 0) { const lx = dx > 0 ? x + S * (1 - t * 0.92 - 0.04) : x + S * (t * 0.92 + 0.04); ctx.moveTo(lx, y + S * pinch); ctx.lineTo(lx, y + S * (1 - pinch)); }
          else { const ly = dy > 0 ? y + S * (1 - t * 0.92 - 0.04) : y + S * (t * 0.92 + 0.04); ctx.moveTo(x + S * pinch, ly); ctx.lineTo(x + S * (1 - pinch), ly); }

        for (let i = 0; i < n; i++) {
          const cx = f.x * S + j(0.18), cy = f.y * S + j(0.18), r = S * rr.range(0.04, 0.09);
          ctx.beginPath();
          for (let a = 0; a < 5; a++) { const ang = a / 5 * Math.PI * 2 + rr.f(); const rad = r * rr.range(0.7, 1.2); const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }

        }
      } else if (f.type === "key") {

        ctx.save(); ctx.strokeStyle = pal.floor; ctx.lineWidth = S * 0.16; ctx.lineCap = "round"; ctx.lineJoin = "round";

          ctx.beginPath(); ctx.arc(x - u * 1.7, y, u * 0.95, 0, Math.PI * 2);

          ctx.moveTo(x + u * 1.5, y); ctx.lineTo(x + u * 1.5, y + u); ctx.moveTo(x + u * 2.3, y); ctx.lineTo(x + u * 2.3, y + u);

        ctx.beginPath(); ctx.arc(f.x * S, f.y * S, f.r * S, 0, Math.PI * 2);
        ctx.fillStyle = pal.floorAlt; ctx.fill();
        ctx.save(); ctx.clip();
        ctx.strokeStyle = pal.detail; ctx.lineWidth = Math.max(1, S * 0.025); ctx.beginPath();

        }

        ctx.beginPath(); ctx.arc(f.x * S, f.y * S, (f.r + 0.14) * S, 0, Math.PI * 2);
        ctx.lineWidth = Math.max(1, S * 0.025); ctx.stroke();
      } else if (f.type === "bust") {
        ctx.beginPath(); ctx.arc(f.x * S, f.y * S, S * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = pal.floorAlt; ctx.fill(); ctx.lineWidth = Math.max(1, S * 0.035); ctx.strokeStyle = pal.ink; ctx.stroke();
        ctx.beginPath(); ctx.arc(f.x * S, f.y * S, S * 0.07, 0, Math.PI * 2); ctx.fillStyle = pal.ink; ctx.fill();
      } else if (f.type === "statue") {
        const x = f.x * S, y = f.y * S;
        ctx.fillStyle = pal.floorAlt; ctx.strokeStyle = pal.ink; ctx.lineWidth = Math.max(1, S * 0.04);
        ctx.fillRect(x - S * 0.3, y - S * 0.3, S * 0.6, S * 0.6); ctx.strokeRect(x - S * 0.3, y - S * 0.3, S * 0.6, S * 0.6);

      }
    }

  }

  // ---- entrances off the map: an arrow pointing out ----
  for (const e of map.exits || []) {
    const [dx, dy] = DIRS[e.d], cx = (e.x + 0.5 - dx * 0.6) * S, cy = (e.y + 0.5 - dy * 0.6) * S, a = S * 0.22;
    ctx.strokeStyle = pal.ink; ctx.lineWidth = Math.max(1, S * 0.05); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(cx - dx * a * 1.4, cy - dy * a * 1.4); ctx.lineTo(cx + dx * a * 1.4, cy + dy * a * 1.4);
    ctx.moveTo(cx + dx * a * 1.4 - (dx * a + dy * a), cy + dy * a * 1.4 - (dy * a - dx * a));

  // ---- room numbers ----
  if (st.numbers) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    for (const r of map.rooms) {
      const size = Math.min(r.w, r.h) <= 2 ? 0.5 : 0.66;
      ctx.font = `700 ${S * size}px Alegreya, Georgia, serif`;
      const x = r.lx * S, y = r.ly * S + S * 0.04;

}

/* ================================================================
   UI wiring
   ================================================================ */
const $ = id => document.getElementById(id);
const layoutIds = ["seed", "rooms", "layout", "symmetry", "paths", "mix", "hallMin", "hallMax", "hallShape", "minSize", "maxSize", "shapes", "niches", "water", "river", "elevation", "entrances", "loops", "doors"];
const lookIds = ["walls", "weight", "floor", "grid", "outside", "depth", "cluster", "strokeGap", "palette", "shadow", "light", "numbers", "decor", "showTitle", "grit"];
const SEED_WORDS = ["moss", "ember", "salt", "rook", "veil", "brass", "cinder", "hollow", "lark", "ossuary", "marrow", "tallow", "wick", "flint", "gloam", "barrow", "quill", "rust"];
let map = null;

function newSeed() {
  const r = Math.random;
  return SEED_WORDS[Math.floor(r() * SEED_WORDS.length)] + "-" + SEED_WORDS[Math.floor(r() * SEED_WORDS.length)] + "-" + Math.floor(r() * 900 + 100);
}
function layoutOpts() {
  let minSize = +$("minSize").value, maxSize = +$("maxSize").value;
  if (maxSize < minSize) maxSize = minSize;
  let hallMin = +$("hallMin").value, hallMax = +$("hallMax").value;
  if (hallMax < hallMin) hallMax = hallMin;
  return {
    seed: $("seed").value.trim() || "dungeon",
    rooms: +$("rooms").value, layout: $("layout").value, mix: +$("mix").value / 100,
    hallMin, hallMax, hallShape: $("hallShape").value, minSize, maxSize,
    loops: +$("loops").value / 100, doors: $("doors").value,
    symmetry: $("symmetry").value, paths: $("paths").value,
    entrances: +$("entrances").value, river: $("river").value, elevation: $("elevation").value,
    shapes: $("shapes").value, niches: +$("niches").value / 100, water: +$("water").value / 100
  };
}
function lookOpts() {
  return {
    walls: $("walls").value, weight: +$("weight").value, floor: $("floor").value, grid: $("grid").value,
    outside: $("outside").value, depth: +$("depth").value,
    cluster: +$("cluster").value / 100, strokeGap: +$("strokeGap").value / 100, palette: $("palette").value,
    shadow: $("shadow").value, light: +$("light").value, numbers: $("numbers").checked, decor: $("decor").checked, title: $("showTitle").checked, grit: $("grit").checked
  };
}
function syncOutputs() {
  const sq = v => +(v / 100).toFixed(3) + " sq";
  const compass = v => ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"][Math.round(v / 22.5) % 16];
  const fmt = { niches: v => v + "%", water: v => v + "%", light: v => compass(+v) + " · " + v + "°", mix: v => v + "%", loops: v => v + "%", weight: v => v + "%", cluster: sq, strokeGap: sq, depth: v => v + " sq" };
  document.querySelectorAll("output[for]").forEach(out => { const id = out.htmlFor.value; const v = $(id).value; out.textContent = fmt[id] ? fmt[id](v) : v; });
  const lay = $("layout").value;
  $("mixRow").hidden = lay !== "mixed";
  $("hallRow").hidden = lay === "shared" || lay === "scattered";
  $("shapeRow").hidden = lay === "shared" || lay === "scattered";
  const out = $("outside").value;
  $("depth").disabled = out === "solid" || out === "none";
  $("lightRow").hidden = $("shadow").value !== "cast";
  $("cluster").disabled = $("strokeGap").disabled = !(out === "hatch" || out === "cross" || out === "pen");
}
function drawScreen() {
  if (!map) return;
  const wrap = $("mapwrap"), c = $("map");
  const st = lookOpts();
  const rows = map.H + (st.title ? 3 : 0);
  const pad = 2 * parseFloat(getComputedStyle(wrap).paddingLeft);
  const cw = Math.max(100, wrap.clientWidth - pad), ch = Math.max(100, wrap.clientHeight - pad);
  const cssS = Math.min(cw / map.W, ch / rows);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  renderMap(c, map, st, cssS * dpr);
  c.style.width = (c.width / dpr) + "px"; c.style.height = (c.height / dpr) + "px";
  $("dname").textContent = map.title;
  const halls = map.cells.reduce((n, v) => n + (v === -1 ? 1 : 0), 0);
  const loopNote = map.cycle ? (layoutOpts().paths === "mixed" ? " · one loop" : " · main loop") + ({ lock: ", locked route and key", secret: " with a secret route", open: "" }[map.cycle.kind] || "") : "";
  const ents = 1 + (map.exits ? map.exits.length : 0) + (map.upRooms ? map.upRooms.length : 0);
  $("dmeta").textContent = `${map.rooms.length} rooms · ${ents} ${ents === 1 ? "entrance" : "entrances"} · ${map.doors.length} doorways · ${halls * 5} ft of halls${loopNote} · ${map.W} × ${map.H} squares`;
}
function regenerate() { map = generate(layoutOpts()); drawScreen(); }

let pending = 0, pendingLayout = false;
function schedule(layoutChanged) {
  pendingLayout = pendingLayout || layoutChanged;
  if (pending) return;
  pending = requestAnimationFrame(() => { pending = 0; syncOutputs(); if (pendingLayout) regenerate(); else drawScreen(); pendingLayout = false; });
}
function applyPreset(name) {
  const p = PRESETS[name]; if (!p) return;
  $("walls").value = p.walls; $("floor").value = p.floor; $("grid").value = p.grid; $("outside").value = p.outside;
  $("palette").value = p.palette; $("depth").value = p.depth; $("weight").value = p.weight; $("shadow").value = p.shadow;
  $("cluster").value = p.cluster || 45; $("strokeGap").value = p.strokeGap || 10; $("grit").checked = !!p.grit;
}

layoutIds.forEach(id => $(id).addEventListener("input", () => schedule(true)));
lookIds.forEach(id => $(id).addEventListener("input", () => { if (["walls", "floor", "grid", "outside", "palette", "depth", "weight", "shadow", "cluster", "strokeGap", "grit"].includes(id)) $("preset").value = "custom"; schedule(false); }));
$("preset").addEventListener("input", () => { applyPreset($("preset").value); schedule(false); });
$("reroll").addEventListener("click", () => { $("seed").value = newSeed(); schedule(true); });
window.addEventListener("resize", () => schedule(false));

$("export").addEventListener("click", () => {
  if (!map) return;
  const st = lookOpts();
  let S = +$("ppi").value;
  const maxSide = 12000, rows = map.H + (st.title ? 3 : 0);
  if (Math.max(map.W, rows) * S > maxSide) S = Math.floor(maxSide / Math.max(map.W, rows));
  const c = document.createElement("canvas");
  renderMap(c, map, st, S);
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const old = $("exportLink").href; if (old && old.startsWith("blob:")) URL.revokeObjectURL(old);
    $("exportImg").src = url; $("exportLink").href = url;
    const fname = ($("seed").value.trim() || "dungeon").replace(/[^a-z0-9-_]+/gi, "-") + ".png";
    $("exportLink").download = fname;
    $("exportInfo").textContent = `${c.width} × ${c.height} px at ${S} px per square. If Download does nothing here, right-click or long-press the image to save it.`;
    $("overlay").hidden = false;
  }, "image/png");
});
$("closeOverlay").addEventListener("click", () => { $("overlay").hidden = true; });
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) $("overlay").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("overlay").hidden = true; });

$("seed").value = "ember-lark-417";
applyPreset("sketch");
syncOutputs();
regenerate();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawScreen());
</script>
